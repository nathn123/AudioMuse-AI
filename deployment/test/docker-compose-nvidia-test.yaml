services:
  redis:
    image: redis:7-alpine
    container_name: audiomuse-nvidia-test-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: audiomuse-nvidia-test-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  audiomuse-ai-flask:
    container_name: audiomuse-nvidia-test-flask
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
    image: audiomuse-ai-local-nvidia:latest
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    environment:
      SERVICE_TYPE: "flask"
      TZ: "${TZ:-UTC}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      TEMP_DIR: "/app/temp_audio"
    entrypoint: ["/app/docker-entrypoint.sh"]   # ← overridden
    volumes:
      - temp-audio-flask:/app/temp_audio
      - ../../tasks:/app/tasks            # ← Only tasks/ (your analysis code)
      - ../../config.py:/app/config.py    # ← config.py if you edit it
      - ../../database.py:/app/database.py
      - ../../app_analysis.py:/app/app_analysis.py
      - ../../app_helper.py:/app/app_helper.py
      - ../../app_dashboard.py:/app/app_dashboard.py
      - ../../error:/app/error
      - ../../flask_app.py:/app/flask_app.py
      - ../../static:/app/static          # ← Static assets for hot-reload
      - ../../templates:/app/templates    # ← Templates for hot-reload
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  audiomuse-ai-worker:
    container_name: audiomuse-nvidia-test-worker
    build:
      context: ../..
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
    image: audiomuse-ai-local-nvidia-worker:latest
    environment:
      SERVICE_TYPE: "worker"
      TZ: "${TZ:-UTC}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      USE_GPU_CLUSTERING: "${USE_GPU_CLUSTERING:-true}"
      SEQUENTIAL_ANALYSIS: "${SEQUENTIAL_ANALYSIS:-false}"
      TEMP_DIR: "/app/temp_audio"
    entrypoint: ["/app/docker-entrypoint.sh"]   # ← overridden
    volumes:
    - temp-audio-worker:/app/temp_audio
    - ../../tasks:/app/tasks            # ← Only tasks/ (your analysis code)
    - ../../config.py:/app/config.py
    - ../../database.py:/app/database.py
    - ../../app_helper.py:/app/app_helper.py
    - ../../error:/app/error
    # Worker doesn't need static/templates        # Mount source code for hot-reload
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  temp-audio-flask:
  temp-audio-worker:
